<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DocNote · 속지 선택</title><style>
:root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body)}body{padding-bottom:28px}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;gap:12px}.back{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);font-size:22px}.header h1{margin:0;font-family:var(--display);font-size:24px;font-weight:650}.sub{margin:8px 0 0 56px;color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;overflow:auto;margin-top:24px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);font-size:13px}.chip.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.paper-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.paper-card{padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--surface);text-align:left}.paper-card.active{border:2px solid var(--accent);padding:9px}.paper{height:110px;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:9px;background:var(--surface)}.paper:before{content:"";position:absolute;inset:16px 12px;background:repeating-linear-gradient(to bottom,transparent 0 14px,oklch(86% .02 245) 15px 16px)}.blank{background:oklch(99% .004 230)}.grid:before{background:linear-gradient(to right,transparent 0 19%,oklch(88% .02 245) 20% 21%,transparent 22% 39%,oklch(88% .02 245) 40% 41%,transparent 42% 59%,oklch(88% .02 245) 60% 61%,transparent 62% 79%,oklch(88% .02 245) 80% 81%,transparent 82%),linear-gradient(to bottom,transparent 0 19%,oklch(88% .02 245) 20% 21%,transparent 22% 39%,oklch(88% .02 245) 40% 41%,transparent 42% 59%,oklch(88% .02 245) 60% 61%,transparent 62% 79%,oklch(88% .02 245) 80% 81%,transparent 82%)}.dotted:before{background-image:radial-gradient(oklch(78% .03 245) 1px,transparent 1px);background-size:10px 10px}.cornell:after{content:"";position:absolute;top:16px;bottom:16px;left:34%;border-left:2px solid oklch(72% .08 245)}.checklist:after{content:"□  □  □";position:absolute;left:14px;bottom:16px;color:var(--muted);font-size:13px}.planner:after{content:"월  화  수  목  금";position:absolute;left:12px;top:20px;color:var(--muted);font-size:9px;word-spacing:7px}.paper-meta{padding:8px 2px 0}.paper-meta strong{display:block;font-size:13px}.paper-meta span{display:block;margin-top:3px;color:var(--muted);font-size:11px}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.paper-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main class="app" data-od-id="paper-picker-screen"><header class="header"><a class="back" href="docnote-new-notebook-refined.html" aria-label="새 노트북으로 돌아가기" data-od-id="paper-picker-back">‹</a><h1 data-od-id="paper-picker-title">속지 선택</h1></header><p class="sub">쓰는 방식에 맞는 종이를 고르세요.</p><div class="filters" role="group" aria-label="속지 카테고리" data-od-id="paper-filters"><button class="chip active">기본</button><button class="chip">공부</button><button class="chip">업무</button><button class="chip">플래너</button></div><section class="paper-grid" data-od-id="paper-grid"><button class="paper-card active" data-od-id="paper-ruled"><div class="paper ruled"></div><div class="paper-meta"><strong>줄 노트</strong><span>선택됨 · 기본</span></div></button><button class="paper-card" data-od-id="paper-blank"><div class="paper blank"></div><div class="paper-meta"><strong>빈 종이</strong><span>기본</span></div></button><button class="paper-card" data-od-id="paper-grid"><div class="paper grid"></div><div class="paper-meta"><strong>그리드</strong><span>공부</span></div></button><button class="paper-card" data-od-id="paper-dotted"><div class="paper dotted"></div><div class="paper-meta"><strong>도트</strong><span>공부</span></div></button><button class="paper-card" data-od-id="paper-cornell"><div class="paper cornell"></div><div class="paper-meta"><strong>Cornell</strong><span>학습 정리</span></div></button><button class="paper-card" data-od-id="paper-checklist"><div class="paper checklist"></div><div class="paper-meta"><strong>체크리스트</strong><span>업무</span></div></button><button class="paper-card" data-od-id="paper-planner"><div class="paper planner"></div><div class="paper-meta"><strong>주간 플래너</strong><span>플래너</span></div></button></section></main><script>document.querySelectorAll('.paper-card').forEach(function(card){card.addEventListener('click',function(){document.querySelectorAll('.paper-card').forEach(function(item){item.classList.remove('active');var s=item.querySelector('.paper-meta span');s.textContent=s.textContent.replace('선택됨 · ','')});card.classList.add('active');card.querySelector('.paper-meta span').textContent='선택됨 · '+card.querySelector('.paper-meta span').textContent})});</script></body></html>
