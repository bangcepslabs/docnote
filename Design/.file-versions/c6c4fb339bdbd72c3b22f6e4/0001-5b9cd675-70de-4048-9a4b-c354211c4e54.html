<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocNote · 설정</title>
  <style>
    :root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--nav:76px}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}button,a{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:0 auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.title{margin:0;font-family:var(--display);font-size:24px;line-height:1.35;font-weight:650}.close{width:44px;height:44px;border:0;background:transparent;border-radius:12px;color:var(--muted);font-size:22px}.close:hover{background:var(--subtle);color:var(--fg)}.intro{padding-top:8px}.intro p{margin:0;color:var(--muted);font-size:15px;line-height:1.75}.group{margin-top:24px}.group h2{margin:0 0 12px;font-size:17px;line-height:1.45;font-weight:650}.panel{overflow:hidden;border:1px solid color-mix(in oklch,var(--border) 72%,transparent);border-radius:14px;background:var(--surface)}.row{width:100%;min-height:68px;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}.row+.row{border-top:1px solid color-mix(in oklch,var(--border) 70%,transparent)}.row:hover{background:var(--subtle)}.row-icon{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:10px;background:var(--subtle);color:var(--muted)}.row-copy{min-width:0;flex:1}.row-copy strong{display:block;font-size:14px;line-height:1.5}.row-copy span{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.5}.value{color:var(--muted);font-size:12px;font-weight:650}.switch{width:44px;height:26px;position:relative;border-radius:99px;background:var(--border)}.switch.on{background:var(--accent)}.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface)}.switch.on:after{transform:translateX(18px)}.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid color-mix(in oklch,var(--border) 75%,transparent);backdrop-filter:blur(14px)}.nav-inner{width:min(100%,720px);height:60px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{min-height:48px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;line-height:1.2;cursor:pointer}.nav-item:hover{background:var(--subtle);color:var(--fg)}.nav-item.active{background:var(--accent-soft);color:var(--fg);font-weight:600}.nav-icon{width:24px;height:24px;display:grid;place-items:center;font-size:20px;line-height:1}.nav-item.create .nav-icon{font-size:23px;color:var(--accent)}@media(min-width:600px){.app{padding-left:24px;padding-right:24px;padding-bottom:36px}.header{height:72px}.title{font-size:26px}.bottom-nav{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
  <main class="app" data-od-id="settings-screen"><header class="header" data-od-id="settings-header"><h1 class="title" data-od-id="settings-title">설정</h1><button class="close" aria-label="설정 닫기" data-od-id="settings-close">×</button></header><section class="intro" data-od-id="settings-intro"><p>DocNote를 사용하는 방식과 저장 환경을 관리합니다.</p></section>
    <section class="group" data-od-id="settings-preferences"><h2>사용 환경</h2><div class="panel"><button class="row" data-od-id="settings-theme"><span class="row-icon">◐</span><span class="row-copy"><strong>화면 테마</strong><span>기기 설정에 맞춤</span></span><span class="value">시스템</span></button><button class="row" data-od-id="settings-autosave"><span class="row-icon">✓</span><span class="row-copy"><strong>자동 저장</strong><span>변경 사항을 자동으로 저장합니다</span></span><span class="switch on" aria-label="자동 저장 켜짐"></span></button></div></section>
    <section class="group" data-od-id="settings-storage"><h2>문서 관리</h2><div class="panel"><button class="row" data-od-id="settings-trash"><span class="row-icon">⌫</span><span class="row-copy"><strong>휴지통</strong><span>삭제한 문서를 확인합니다</span></span><span class="value">›</span></button><button class="row" data-od-id="settings-storage-info"><span class="row-icon">▤</span><span class="row-copy"><strong>저장 공간</strong><span>현재 기기에 저장된 문서</span></span><span class="value">›</span></button></div></section>
    <section class="group" data-od-id="settings-about"><h2>DocNote 정보</h2><div class="panel"><button class="row" data-od-id="settings-about-app"><span class="row-icon">i</span><span class="row-copy"><strong>앱 정보</strong><span>DocNote 버전과 도움말</span></span><span class="value">›</span></button></div></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="settings-bottom-nav"><div class="nav-inner"><a class="nav-item" href="docnote-home-refined.html" data-od-id="nav-home"><span class="nav-icon">⌂</span><span>홈</span></a><a class="nav-item" href="docnote-documents-refined.html" data-od-id="nav-documents"><span class="nav-icon">▤</span><span>문서</span></a><button class="nav-item create" data-od-id="nav-create"><span class="nav-icon">＋</span><span>새로 만들기</span></button><a class="nav-item" href="docnote-search-refined.html" data-od-id="nav-search"><span class="nav-icon">⌕</span><span>검색</span></a><a class="nav-item active" href="docnote-settings-refined.html" aria-current="page" data-od-id="nav-settings"><span class="nav-icon">⚙</span><span>설정</span></a></div></nav>
</body>
</html>
