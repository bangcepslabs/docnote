<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocNote · 문서</title>
  <style>
    :root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--pad:16px;--nav:76px}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:0 auto;padding:0 var(--pad) 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-family:var(--display);font-size:24px;line-height:1.35;font-weight:650;letter-spacing:-.01em}.header-actions{display:flex;gap:4px;align-items:center}.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer}.icon-btn:hover{background:var(--subtle)}.icon-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.intro{padding-top:8px}.intro p{margin:0;color:var(--muted);font-size:15px;line-height:1.75;max-width:42ch}.toolbar{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar-title{font-size:14px;font-weight:600}.toolbar-title span{color:var(--muted);font-weight:450;margin-left:4px}.view-switch{display:flex;gap:2px;padding:2px;background:var(--subtle);border-radius:10px}.view-btn{min-width:40px;height:36px;padding:0 8px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center;cursor:pointer}.view-btn.active{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px color-mix(in oklch,var(--fg) 8%,transparent)}.view-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.filters{display:flex;gap:8px;overflow:auto;margin-top:12px;padding:0 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}.chip:hover{border-color:color-mix(in oklch,var(--fg) 28%,var(--border));color:var(--fg)}.chip.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.document-list{display:grid;gap:8px;margin-top:16px}.doc-card{min-height:88px;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid color-mix(in oklch,var(--border) 72%,transparent);border-radius:var(--radius-md);background:color-mix(in oklch,var(--surface) 84%,transparent);cursor:pointer;transition:border-color .15s,background .15s}.doc-card:hover{border-color:color-mix(in oklch,var(--fg) 24%,var(--border));background:var(--surface)}.preview{width:52px;height:64px;flex:0 0 52px;border-radius:7px;position:relative;overflow:hidden;border:1px solid color-mix(in oklch,var(--fg) 9%,transparent)}.preview.notebook{background:linear-gradient(145deg,oklch(78% .08 205),oklch(68% .1 230));padding:8px;color:oklch(99% .005 230)}.preview.notebook:before{content:"DOCNOTE";font-size:6px;letter-spacing:.12em}.preview.notebook:after{content:"주간 회고";position:absolute;left:8px;bottom:9px;font-size:8px;font-weight:650}.preview.pdf{background:oklch(96% .015 35);padding:9px}.preview.pdf:before{content:"PDF";display:inline-grid;place-items:center;width:22px;height:15px;border-radius:4px;background:oklch(60% .12 35);color:white;font-size:7px;font-weight:700}.preview.pdf:after{content:"";position:absolute;left:9px;right:9px;bottom:10px;height:22px;background:repeating-linear-gradient(to bottom,oklch(72% .02 245) 0 2px,transparent 2px 6px)}.preview.hwp{background:oklch(96% .015 145);padding:9px}.preview.hwp:before{content:"HWP";display:inline-grid;place-items:center;width:25px;height:15px;border-radius:4px;background:oklch(54% .1 145);color:white;font-size:7px;font-weight:700}.preview.hwp:after{content:"";position:absolute;left:9px;right:9px;bottom:10px;height:22px;background:repeating-linear-gradient(to bottom,oklch(72% .02 245) 0 2px,transparent 2px 6px)}.doc-copy{min-width:0;flex:1}.doc-title{font-size:15px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}.doc-more{width:40px;height:40px;flex:0 0 40px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:20px;cursor:pointer}.doc-more:hover{background:var(--subtle);color:var(--fg)}.empty,.state{margin-top:16px;padding:24px 16px;border:1px dashed var(--border);border-radius:var(--radius-md);text-align:center;color:var(--muted)}.empty[hidden],.state[hidden]{display:none}.empty strong,.state strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid color-mix(in oklch,var(--border) 75%,transparent);backdrop-filter:blur(14px)}.nav-inner{width:min(100%,720px);height:60px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{min-height:48px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11px;line-height:1.2;cursor:pointer}.nav-item:hover{background:var(--subtle);color:var(--fg)}.nav-item.active{color:var(--fg);font-weight:600}.nav-icon{font-size:21px;line-height:1;font-weight:400}.nav-item.create{color:var(--accent)}.nav-item.create .nav-icon{font-size:24px}@media(min-width:600px){:root{--pad:24px}.app{padding-bottom:36px}.header{height:72px}.header h1{font-size:26px}.document-list{gap:10px}.bottom-nav{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
  <main class="app" data-od-id="documents-screen">
    <header class="header" data-od-id="documents-header"><h1 data-od-id="documents-title">문서</h1><div class="header-actions"><a class="icon-btn" href="docnote-search-refined.html" aria-label="검색" data-od-id="documents-search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.4 4.4"></path></svg></a><button class="icon-btn" aria-label="새 문서" data-od-id="documents-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button></div></header>
    <section class="intro" data-od-id="documents-intro"><p>가져온 파일과 노트북을 한곳에서 찾아보세요.</p></section>
    <section class="toolbar" data-od-id="documents-toolbar"><div class="toolbar-title">전체 문서<span>12</span></div><div class="view-switch" role="group" aria-label="보기 방식"><button class="view-btn active" aria-label="목록 보기" data-od-id="documents-list-view"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button><button class="view-btn" aria-label="격자 보기" data-od-id="documents-grid-view"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="5" height="5" rx="1"></rect><rect x="14" y="5" width="5" height="5" rx="1"></rect><rect x="5" y="14" width="5" height="5" rx="1"></rect><rect x="14" y="14" width="5" height="5" rx="1"></rect></svg></button></div></section>
    <div class="filters" role="group" aria-label="문서 필터" data-od-id="documents-filters"><button class="chip active" data-filter="all">전체</button><button class="chip" data-filter="notebook">노트북</button><button class="chip" data-filter="pdf">PDF</button><button class="chip" data-filter="hwp">HWP</button></div>
    <section class="document-list" data-od-id="documents-list">
      <article class="doc-card" data-type="notebook" data-od-id="document-card-weekly"><div class="preview notebook" aria-hidden="true"></div><div class="doc-copy"><div class="doc-title">주간 회고 노트</div><div class="doc-meta"><span>노트북</span><span>·</span><span>어제 수정</span></div></div><button class="doc-more" aria-label="주간 회고 노트 더보기" data-od-id="document-more-weekly">···</button></article>
      <article class="doc-card" data-type="pdf" data-od-id="document-card-brief"><div class="preview pdf" aria-hidden="true"></div><div class="doc-copy"><div class="doc-title">프로젝트 브리프.pdf</div><div class="doc-meta"><span>PDF</span><span>·</span><span>3일 전 수정</span></div></div><button class="doc-more" aria-label="프로젝트 브리프 더보기" data-od-id="document-more-brief">···</button></article>
      <article class="doc-card" data-type="hwp" data-od-id="document-card-meeting"><div class="preview hwp" aria-hidden="true"></div><div class="doc-copy"><div class="doc-title">회의 기록_2026-08-11.hwp</div><div class="doc-meta"><span>HWP</span><span>·</span><span>지난주 수정</span></div></div><button class="doc-more" aria-label="회의 기록 더보기" data-od-id="document-more-meeting">···</button></article>
    </section>
    <div class="empty" hidden data-od-id="documents-empty"><strong>아직 문서가 없습니다</strong>가져온 파일이 이곳에 표시됩니다.</div><div class="state" hidden data-od-id="documents-error"><strong>문서를 불러오지 못했습니다</strong>잠시 후 다시 시도해 주세요.</div>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="documents-bottom-nav"><div class="nav-inner"><a class="nav-item" href="docnote-home-refined.html" data-od-id="nav-home"><span class="nav-icon">⌂</span><span>홈</span></a><a class="nav-item active" href="docnote-documents-refined.html" aria-current="page" data-od-id="nav-documents"><span class="nav-icon">▤</span><span>문서</span></a><button class="nav-item create" data-od-id="nav-create"><span class="nav-icon">＋</span><span>새로 만들기</span></button><a class="nav-item" href="docnote-search-refined.html" data-od-id="nav-search"><span class="nav-icon">⌕</span><span>검색</span></a><a class="nav-item" href="docnote-settings-design.html" data-od-id="nav-settings"><span class="nav-icon">⚙</span><span>설정</span></a></div></nav>
  <script>document.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});b.classList.add('active');var f=b.dataset.filter;document.querySelectorAll('.doc-card').forEach(function(c){c.hidden=f!=='all'&&c.dataset.type!==f})})});document.querySelectorAll('.view-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.view-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active')})});document.querySelector('[data-od-id="documents-add"]').addEventListener('click',function(){alert('새 문서 만들기')});</script>
</body>
</html>
