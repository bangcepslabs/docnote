<style>
:root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--nav:76px}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}button,a{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.title{margin:0;font-family:var(--display);font-size:24px;line-height:1.35;font-weight:650}.close{width:44px;height:44px;border-radius:12px;color:var(--muted);font-size:22px}.close:hover{background:var(--subtle);color:var(--fg)}.preview-content{padding-top:28px;opacity:.62}.ghost-title{width:42%;height:18px;border-radius:6px;background:var(--border)}.ghost-row{height:72px;margin-top:16px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}.scrim{position:fixed;inset:0;z-index:10;background:color-mix(in oklch,var(--fg) 24%,transparent)}.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;margin:auto;width:min(100%,720px);padding:10px 16px calc(20px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--surface);box-shadow:0 -12px 32px color-mix(in oklch,var(--fg) 16%,transparent)}.handle{width:36px;height:4px;margin:0 auto 18px;border-radius:99px;background:var(--border)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet-head h2{margin:0;font-size:18px;font-weight:650}.sheet-head span{color:var(--muted);font-size:12px}.actions{display:grid;gap:8px}.action{min-height:68px;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid color-mix(in oklch,var(--border) 72%,transparent);border-radius:14px;background:var(--surface);text-align:left}.action:hover{background:var(--subtle);border-color:var(--border)}.action.primary{background:var(--accent-soft);border-color:color-mix(in oklch,var(--accent) 18%,var(--border))}.action-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border-radius:11px;background:var(--subtle);color:var(--muted)}.primary .action-icon{background:var(--accent);color:var(--surface)}.action-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.action-copy{min-width:0;flex:1}.action-copy strong{display:block;font-size:14px;line-height:1.45}.action-copy span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}.arrow{color:var(--muted);font-size:18px}.bottom-nav{position:fixed;z-index:5;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid color-mix(in oklch,var(--border) 75%,transparent);backdrop-filter:blur(14px)}.nav-inner{width:min(100%,720px);height:60px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{min-height:48px;border-radius:12px;display:grid;place-items:center;gap:3px;color:var(--muted);font-size:11px}.nav-item.create{color:var(--accent);font-weight:600}.nav-icon{width:24px;height:24px;display:grid;place-items:center}.nav-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.bottom-nav{padding-left:24px;padding-right:24px}}
