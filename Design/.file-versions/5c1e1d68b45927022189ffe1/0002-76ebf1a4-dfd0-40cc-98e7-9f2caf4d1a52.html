<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DocNote · 생성 인터랙션</title>
<style>
:root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--success:oklch(52% .12 150);--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--nav:76px}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}button,a,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:var(--display);font-size:22px;font-weight:700}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--fg)}.icon-btn:hover{background:var(--subtle)}.icon-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.hero{margin-top:16px}.eyebrow{margin:0;color:var(--muted);font-size:12px;font-weight:650}.hero h1{margin:8px 0 0;font-family:var(--display);font-size:24px;line-height:1.4}.hero p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section h2{margin:0;font-size:17px;font-weight:650}.section-link{color:var(--muted);font-size:12px}.notebooks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.notebook{overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--surface)}.cover{height:136px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.cover.blue{background:oklch(86% .08 235);color:oklch(31% .09 245)}.cover.sage{background:oklch(87% .065 135);color:oklch(32% .07 135)}.cover strong{font-size:9px;letter-spacing:.08em}.cover span{font-family:var(--display);font-size:16px;font-weight:650}.notebook-meta{padding:10px 12px}.notebook-meta strong{display:block;font-size:13px}.notebook-meta span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.documents{display:grid;gap:8px}.document{min-height:76px;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.doc-preview{width:44px;height:56px;flex:0 0 44px;border:1px solid var(--border);border-radius:7px;background:oklch(96% .02 35);position:relative}.doc-preview:after{content:"";position:absolute;inset:12px 8px;background:repeating-linear-gradient(to bottom,oklch(76% .02 245) 0 2px,transparent 2px 8px)}.doc-copy{min-width:0;flex:1}.doc-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.doc-copy span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.scrim{position:fixed;inset:0;z-index:20;background:color-mix(in oklch,var(--fg) 28%,transparent);opacity:1;transition:opacity .15s}.scrim[hidden],.sheet[hidden]{display:none}.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;width:min(100%,720px);margin:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--surface);box-shadow:0 -12px 32px color-mix(in oklch,var(--fg) 16%,transparent);max-height:calc(100dvh - 32px);overflow:auto}.handle{width:36px;height:4px;margin:0 auto 18px;border-radius:99px;background:var(--border)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet-head h2{margin:0;font-size:18px;font-weight:650}.sheet-head span{color:var(--muted);font-size:12px}.sheet-close{width:40px;height:40px;color:var(--muted);font-size:20px;border-radius:10px}.sheet-close:hover{background:var(--subtle)}.actions{display:grid;gap:8px}.action{min-height:68px;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid color-mix(in oklch,var(--border) 72%,transparent);border-radius:14px;background:var(--surface);text-align:left}.action:hover{background:var(--subtle)}.action.primary{background:var(--accent-soft);border-color:color-mix(in oklch,var(--accent) 18%,var(--border))}.action-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border-radius:11px;background:var(--subtle);color:var(--muted)}.primary .action-icon{background:var(--accent);color:var(--surface)}.action-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.action-copy{min-width:0;flex:1}.action-copy strong{display:block;font-size:14px;line-height:1.45}.action-copy span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}.arrow{color:var(--muted);font-size:18px}.stepper{display:flex;align-items:center;gap:8px;margin:0 0 20px}.step{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.step.active{color:var(--fg);font-weight:650}.step-dot{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--subtle);font-size:11px}.step.active .step-dot{background:var(--accent);color:var(--surface)}.step-line{height:1px;flex:1;background:var(--border)}.notebook-heading{margin:0;font-family:var(--display);font-size:20px;line-height:1.4}.notebook-sub{margin:8px 0 20px;color:var(--muted);font-size:14px;line-height:1.65}.field{display:block}.field span{display:block;margin-bottom:8px;font-size:13px;font-weight:650}.field input{width:100%;height:48px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);outline:0}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 12%,transparent)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.choice{min-height:82px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left}.choice:hover{background:var(--subtle)}.choice strong{display:block;font-size:13px}.choice span{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}.mini-cover,.mini-paper{height:34px;margin-bottom:8px;border-radius:7px}.mini-cover{background:oklch(86% .08 235)}.mini-paper{background:repeating-linear-gradient(to bottom,var(--subtle) 0 8px,oklch(87% .02 245) 9px 10px)}.sheet-actions{display:flex;gap:8px;margin-top:20px}.btn{min-height:46px;border-radius:12px;padding:0 16px;border:1px solid var(--border);font-weight:650}.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--surface)}.btn:hover{background:var(--subtle)}.btn.primary:hover{background:oklch(36% .14 245)}.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid color-mix(in oklch,var(--border) 75%,transparent);backdrop-filter:blur(14px)}.nav-inner{width:min(100%,720px);height:60px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{min-height:48px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;gap:3px;color:var(--muted);font-size:11px}.nav-item:hover{background:var(--subtle);color:var(--fg)}.nav-item.create{background:var(--accent-soft);color:var(--fg);font-weight:650}.nav-icon{width:24px;height:24px;display:grid;place-items:center}.nav-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.bottom-nav{padding-left:24px;padding-right:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" data-od-id="create-flow-screen"><header class="header"><strong class="brand">DocNote</strong><a class="icon-btn" href="docnote-search-refined.html" aria-label="검색" data-od-id="flow-search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.4 4.4"></path></svg></a></header><section class="hero"><p class="eyebrow">오늘의 작업 공간</p><h1>최근 작업을 이어가세요</h1><p>현재 화면을 유지한 채 새 문서와 노트북을 시작합니다.</p></section><section class="section"><div class="section-head"><h2>내 노트북</h2><span class="section-link">모두 보기 ›</span></div><div class="notebooks"><article class="notebook"><div class="cover blue"><strong>DOCNOTE</strong><span>공부 기록</span></div><div class="notebook-meta"><strong>공부 기록</strong><span>Cornell · 12페이지</span></div></article><article class="notebook"><div class="cover sage"><strong>DOCNOTE</strong><span>프로젝트 노트</span></div><div class="notebook-meta"><strong>프로젝트 노트</strong><span>줄 노트 · 8페이지</span></div></article></div></section><section class="section"><div class="section-head"><h2>최근 문서</h2><span class="section-link">문서 보기 ›</span></div><div class="documents"><article class="document"><div class="doc-preview"></div><div class="doc-copy"><strong>2024_회의자료.pdf</strong><span>PDF · 어제 수정</span></div></article><article class="document"><div class="doc-preview"></div><div class="doc-copy"><strong>서비스 기획안.hwpx</strong><span>HWPX · 월요일 수정</span></div></article></div></section></main>
<div class="scrim" id="scrim" hidden data-od-id="create-flow-scrim"></div>
<section class="sheet" id="create-sheet" role="dialog" aria-modal="true" aria-labelledby="create-sheet-title" hidden data-state="create" data-od-id="create-sheet"><div class="handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="create-sheet-title">새로 만들기</h2><button class="sheet-close" type="button" aria-label="새로 만들기 닫기" data-od-id="create-sheet-close">×</button></div><div class="actions"><button class="action primary" type="button" data-action="notebook" data-od-id="create-new-note"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M6 4h10l2 2v14H6z"></path><path d="M9 9h6M9 13h6M9 17h4"></path></svg></span><span class="action-copy"><strong>새 노트</strong><span>표지와 속지를 골라 시작합니다.</span></span><span class="arrow">›</span></button><button class="action" type="button" data-od-id="create-pdf"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"></path><path d="M14 4v5h5M12 11v6M9.5 14.5 12 17l2.5-2.5"></path></svg></span><span class="action-copy"><strong>PDF 가져오기</strong><span>PDF 문서를 불러옵니다.</span></span><span class="arrow">›</span></button><button class="action" type="button" data-od-id="create-hwp"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"></path><path d="M14 4v5h5M8 14h8M8 17h5"></path></svg></span><span class="action-copy"><strong>HWP 가져오기</strong><span>한글 문서를 불러옵니다.</span></span><span class="arrow">›</span></button><button class="action" type="button" data-od-id="create-folder"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"></path></svg></span><span class="action-copy"><strong>폴더 만들기</strong><span>문서와 노트북을 정리합니다.</span></span><span class="arrow">›</span></button></div></section>
<section class="sheet" id="notebook-sheet" role="dialog" aria-modal="true" aria-labelledby="notebook-sheet-title" hidden data-state="notebook" data-od-id="notebook-step-sheet"><div class="handle" aria-hidden="true"></div><div class="sheet-head"><button class="sheet-close" type="button" aria-label="생성 메뉴로 돌아가기" data-od-id="notebook-sheet-back">‹</button><h2 id="notebook-sheet-title">새 노트</h2><button class="sheet-close" type="button" aria-label="새 노트 닫기" data-od-id="notebook-sheet-close">×</button></div><div class="stepper" aria-label="노트북 생성 단계"><span class="step active"><span class="step-dot">1</span>제목</span><span class="step-line"></span><span class="step"><span class="step-dot">2</span>표지</span><span class="step-line"></span><span class="step"><span class="step-dot">3</span>속지</span></div><h3 class="notebook-heading">새 기록을 위한 공간</h3><p class="notebook-sub">제목을 입력한 뒤 표지와 속지를 선택하세요.</p><label class="field"><span>노트북 이름</span><input type="text" value="새 노트북" aria-label="노트북 이름" data-od-id="notebook-name"></label><div class="choices"><button class="choice" type="button" data-od-id="notebook-cover-choice"><div class="mini-cover"></div><strong>표지</strong><span>차분한 블루 · 선택하기</span></button><button class="choice" type="button" data-od-id="notebook-paper-choice"><div class="mini-paper"></div><strong>속지</strong><span>줄 노트 · 선택하기</span></button></div><div class="sheet-actions"><button class="btn" type="button" data-od-id="notebook-cancel">취소</button><button class="btn primary" type="button" data-od-id="notebook-create">노트북 만들기</button></div></section>
<nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="flow-bottom-nav"><div class="nav-inner"><a class="nav-item" href="docnote-home-refined.html"><span class="nav-icon">⌂</span><span>홈</span></a><a class="nav-item" href="docnote-documents-refined.html"><span class="nav-icon">▤</span><span>문서</span></a><button class="nav-item create" type="button" id="open-create" data-od-id="nav-create"><span class="nav-icon">＋</span><span>새로 만들기</span></button><a class="nav-item" href="docnote-search-refined.html"><span class="nav-icon">⌕</span><span>검색</span></a><a class="nav-item" href="docnote-settings-refined.html"><span class="nav-icon">⚙</span><span>설정</span></a></div></nav>
<script>(function(){var scrim=document.getElementById('scrim'),create=document.getElementById('create-sheet'),notebook=document.getElementById('notebook-sheet'),open=document.getElementById('open-create');function show(sheet){scrim.hidden=false;create.hidden=sheet!==create;notebook.hidden=sheet!==notebook}function close(){scrim.hidden=true;create.hidden=true;notebook.hidden=true}open.addEventListener('click',function(){show(create)});scrim.addEventListener('click',close);document.querySelector('[data-od-id="create-sheet-close"]').addEventListener('click',close);document.querySelector('[data-action="notebook"]').addEventListener('click',function(){show(notebook)});document.querySelector('[data-od-id="notebook-sheet-back"]').addEventListener('click',function(){show(create)});document.querySelector('[data-od-id="notebook-sheet-close"]').addEventListener('click',close);document.querySelector('[data-od-id="notebook-cancel"]').addEventListener('click',function(){show(create)});document.querySelector('[data-od-id="notebook-create"]').addEventListener('click',function(){close()});document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});}());</script>
</body></html>
