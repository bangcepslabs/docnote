<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DocNote · 새 노트북</title><style>
:root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body)}body{padding-bottom:28px}button,a,input{font:inherit;color:inherit}button,a{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-family:var(--display);font-size:24px;font-weight:650}.back{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--muted);font-size:22px}.stepper{display:flex;align-items:center;gap:8px;margin-top:12px}.step{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.step.active{color:var(--fg);font-weight:650}.step-dot{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--subtle);font-size:11px}.step.active .step-dot{background:var(--accent);color:var(--surface)}.step-line{height:1px;flex:1;background:var(--border)}.intro{margin-top:28px}.intro h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.4}.intro p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.field{display:block;margin-top:24px}.field span{display:block;margin-bottom:8px;font-size:13px;font-weight:650}.field input{width:100%;height:48px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);outline:0}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 12%,transparent)}.selection{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.selection-card{min-height:92px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}.selection-card strong{display:block;font-size:14px}.selection-card span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.mini-cover{height:38px;margin-bottom:10px;border-radius:8px;background:oklch(89% .06 205)}.mini-paper{height:38px;margin-bottom:10px;border-radius:8px;background:repeating-linear-gradient(to bottom,var(--subtle) 0 9px,oklch(87% .02 245) 10px 11px)}.footer-actions{display:flex;gap:8px;margin-top:32px}.btn{min-height:48px;border-radius:12px;padding:0 16px;border:1px solid var(--border);background:var(--surface);font-weight:650}.btn.primary{flex:1;border-color:var(--accent);background:var(--accent);color:var(--surface)}.btn:hover{background:var(--subtle)}.btn.primary:hover{background:oklch(36% .14 245)}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}}
</style></head><body><main class="app" data-od-id="new-notebook-screen"><header class="header"><a class="back" href="docnote-create-refined.html" aria-label="뒤로" data-od-id="new-notebook-back">‹</a><h1 data-od-id="new-notebook-title">새 노트북</h1><span style="width:44px"></span></header><div class="stepper" aria-label="노트북 생성 단계" data-od-id="new-notebook-stepper"><span class="step active"><span class="step-dot">1</span>제목</span><span class="step-line"></span><span class="step"><span class="step-dot">2</span>표지</span><span class="step-line"></span><span class="step"><span class="step-dot">3</span>속지</span></div><section class="intro"><h2>새 기록을 위한 공간</h2><p>노트북의 이름을 정하고, 표지와 속지를 선택하세요.</p></section><label class="field"><span>노트북 이름</span><input type="text" value="새 노트북" aria-label="노트북 이름" data-od-id="new-notebook-name"></label><div class="selection"><a class="selection-card" href="docnote-cover-picker-refined.html" data-od-id="new-notebook-cover"><div class="mini-cover"></div><strong>표지</strong><span>차분한 블루 · 기본 선택</span></a><a class="selection-card" href="docnote-paper-picker-refined.html" data-od-id="new-notebook-paper"><div class="mini-paper"></div><strong>속지</strong><span>줄 노트 · 기본 선택</span></a></div><div class="footer-actions"><a class="btn" href="docnote-home-refined.html">취소</a><button class="btn primary" data-od-id="new-notebook-create">노트북 만들기</button></div></main><script>document.querySelector('[data-od-id="new-notebook-create"]').addEventListener('click',function(){location.href='docnote-home-refined.html'});</script></body></html>
