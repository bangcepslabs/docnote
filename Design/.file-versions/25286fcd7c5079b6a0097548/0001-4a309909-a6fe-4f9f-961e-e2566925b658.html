<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocNote · 설정</title>
  <style>
    :root{--bg:oklch(.977 .004 260);--surface:oklch(1 0 0);--subtle:oklch(.958 .007 255);--fg:oklch(.205 .027 250);--muted:oklch(.49 .025 250);--border:oklch(.90 .012 250);--accent:oklch(.52 .115 247);--accent-soft:oklch(.93 .032 247);--font-display:"SUIT","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}button,a{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{text-decoration:none}.app{max-width:720px;margin:0 auto}.screen{padding-inline:16px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.title{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.35;font-weight:700}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}.icon-btn:hover,.row:hover{background:var(--subtle)}.icon-btn:focus-visible,.row:focus-visible,.nav-item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.intro{padding-top:12px}.intro p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.group{margin-top:32px}.group h2{margin:0 0 12px;font-family:var(--font-display);font-size:17px;line-height:1.45}.panel{overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.row{width:100%;min-height:68px;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}.row+.row{border-top:1px solid var(--border)}.row-icon{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:10px;background:var(--subtle);color:var(--muted)}.row-copy{min-width:0;flex:1}.row-copy strong{display:block;font-size:14px;line-height:1.5}.row-copy span{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.5}.value{color:var(--muted);font-size:12px;font-weight:650}.switch{width:44px;height:26px;position:relative;border-radius:99px;background:var(--border)}.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s ease}.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:80px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid var(--border);backdrop-filter:blur(16px)}.nav-item{min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:650}.nav-item.active{color:var(--accent);background:var(--accent-soft)}.nav-create .create-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--fg)}
    .nav-item{border:0;background:transparent}
  </style>
</head>
<body>
  <main class="app" data-od-id="settings-screen">
    <header class="header screen" data-od-id="settings-header"><h1 class="title">설정</h1><button class="icon-btn" aria-label="설정 닫기" data-od-id="settings-close">×</button></header>
    <section class="screen intro" data-od-id="settings-intro"><p>DocNote를 사용하는 방식과 저장 환경을 관리합니다.</p></section>
    <section class="screen group" data-od-id="settings-preferences"><h2>사용 환경</h2><div class="panel"><button class="row" data-od-id="settings-theme"><span class="row-icon">◐</span><span class="row-copy"><strong>화면 테마</strong><span>기기 설정에 맞춤</span></span><span class="value">시스템</span></button><button class="row" data-od-id="settings-autosave"><span class="row-icon">✓</span><span class="row-copy"><strong>자동 저장</strong><span>변경 사항을 자동으로 저장합니다</span></span><span class="switch on" aria-label="자동 저장 켜짐"></span></button></div></section>
    <section class="screen group" data-od-id="settings-storage"><h2>문서 관리</h2><div class="panel"><button class="row" data-od-id="settings-trash"><span class="row-icon">⌫</span><span class="row-copy"><strong>휴지통</strong><span>삭제한 문서를 확인합니다</span></span><span class="value">›</span></button><button class="row" data-od-id="settings-storage-info"><span class="row-icon">▤</span><span class="row-copy"><strong>저장 공간</strong><span>현재 기기에 저장된 문서</span></span><span class="value">›</span></button></div></section>
    <section class="screen group" data-od-id="settings-about"><h2>DocNote 정보</h2><div class="panel"><button class="row" data-od-id="settings-about-app"><span class="row-icon">i</span><span class="row-copy"><strong>앱 정보</strong><span>DocNote 버전과 도움말</span></span><span class="value">›</span></button></div></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="bottom-navigation"><a class="nav-item" href="docnote-home-design.html" data-od-id="nav-home"><span>⌂</span><span>홈</span></a><a class="nav-item" href="docnote-documents-design.html" data-od-id="nav-documents"><span>▤</span><span>문서</span></a><button class="nav-item nav-create" data-od-id="nav-create"><span class="create-icon">＋</span><span>새로 만들기</span></button><a class="nav-item" href="docnote-search-design.html" data-od-id="nav-search"><span>⌕</span><span>검색</span></a><a class="nav-item active" href="#" aria-current="page" data-od-id="nav-settings"><span>⚙</span><span>설정</span></a></nav>
</body>
</html>
