  <style>
    :root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--radius-md:14px;--nav:76px}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:0 auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-family:var(--display);font-size:24px;line-height:1.35;font-weight:650}.close-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--muted)}.close-btn:hover{background:var(--subtle);color:var(--fg)}.close-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}.search-field{height:48px;margin-top:8px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.search-field:focus-within{border-color:color-mix(in oklch,var(--accent) 46%,var(--border));box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 12%,transparent)}.search-field>svg{width:19px;height:19px;flex:0 0 19px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.search-field input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:15px}.search-field input::placeholder{color:var(--muted)}.search-field input[type="search"]{-webkit-appearance:none;appearance:none}.search-field input[type="search"]::-webkit-search-cancel-button,.search-field input[type="search"]::-webkit-search-decoration{display:none;-webkit-appearance:none}.clear-btn{width:32px;height:32px;padding:0;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;border-radius:8px;color:var(--muted);opacity:.42;display:grid;place-items:center;-webkit-appearance:none;appearance:none}.clear-btn:hover{background:var(--subtle)!important;color:var(--fg);opacity:1}.clear-btn:focus-visible{outline:2px solid color-mix(in oklch,var(--accent) 55%,white)!important;outline-offset:1px}.clear-btn[hidden]{display:none}.clear-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}.filters{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);font-size:13px}.chip:hover{border-color:color-mix(in oklch,var(--fg) 28%,var(--border));color:var(--fg)}.chip.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.result-head{margin-top:24px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.result-head h2{margin:0;font-family:var(--display);font-size:17px;line-height:1.45;font-weight:650}.result-head span{color:var(--muted);font-size:12px}.results{display:grid;gap:8px;margin-top:12px}.result-card{min-height:80px;display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid color-mix(in oklch,var(--border) 72%,transparent);border-radius:var(--radius-md);background:color-mix(in oklch,var(--surface) 84%,transparent)}.result-card[hidden]{display:none}.thumb{width:48px;height:58px;flex:0 0 48px;border-radius:7px;border:1px solid color-mix(in oklch,var(--fg) 9%,transparent);position:relative;overflow:hidden}.thumb.notebook{background:oklch(76% .08 205)}.thumb.notebook:after{content:"노트북";position:absolute;left:7px;bottom:8px;color:white;font-size:8px;font-weight:650}.thumb.pdf{background:oklch(96% .015 35)}.thumb.pdf:before{content:"PDF";position:absolute;left:7px;top:8px;padding:3px 4px;border-radius:4px;background:oklch(60% .12 35);color:white;font-size:7px;font-weight:700}.thumb.hwp{background:oklch(96% .015 145)}.thumb.hwp:before{content:"HWP";position:absolute;left:7px;top:8px;padding:3px 4px;border-radius:4px;background:oklch(54% .1 145);color:white;font-size:7px;font-weight:700}.thumb.memo{background:oklch(91% .05 85)}.thumb.memo:before{content:"메모";position:absolute;left:7px;top:8px;color:oklch(35% .05 80);font-size:8px;font-weight:650}.result-copy{min-width:0;flex:1}.result-title{font-size:14px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-meta{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}.result-more{width:40px;height:40px;padding:0;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:20px}.result-more:hover{background:var(--subtle);color:var(--fg)}.state{margin-top:16px;padding:24px 16px;border:1px dashed var(--border);border-radius:var(--radius-md);text-align:center;color:var(--muted)}.state[hidden]{display:none}.state strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid color-mix(in oklch,var(--border) 75%,transparent);backdrop-filter:blur(14px)}.nav-inner{width:min(100%,720px);height:60px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{min-height:48px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;line-height:1.2}.nav-item:hover{background:var(--subtle);color:var(--fg)}.nav-item.active{background:var(--accent-soft);color:var(--fg);font-weight:600}.nav-icon{width:24px;height:24px;display:grid;place-items:center}.nav-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.nav-item.create .nav-icon{color:var(--accent)}@media(min-width:600px){.app{padding-left:24px;padding-right:24px;padding-bottom:36px}.header{height:72px}.header h1{font-size:26px}.bottom-nav{padding-left:24px;padding-right:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="app" data-od-id="search-screen">
    <header class="header" data-od-id="search-header"><h1 data-od-id="search-title">검색</h1><button class="close-btn" type="button" aria-label="검색 닫기" data-od-id="search-close"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg></button></header>
    <label class="search-field" data-od-id="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.4 4.4"></path></svg><input id="search-input" type="search" placeholder="노트북, 문서, 메모 검색" aria-label="검색어" /><button class="clear-btn" id="clear-search" type="button" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg></button></label>
    <div class="filters" role="group" aria-label="검색 결과 필터" data-od-id="search-filters"><button class="chip active" type="button" data-filter="all">전체</button><button class="chip" type="button" data-filter="notebook">노트북</button><button class="chip" type="button" data-filter="document">문서</button><button class="chip" type="button" data-filter="memo">메모</button></div>
    <section data-od-id="search-results"><div class="result-head"><h2>최근 검색 결과</h2><span id="result-count">4개</span></div><div class="results"><article class="result-card" data-type="notebook" data-od-id="search-result-notebook"><div class="thumb notebook" aria-hidden="true"></div><div class="result-copy"><div class="result-title">주간 회고 노트</div><div class="result-meta">노트북 · 어제 수정</div></div><button class="result-more" type="button" aria-label="주간 회고 노트 더보기">···</button></article><article class="result-card" data-type="document" data-od-id="search-result-pdf"><div class="thumb pdf" aria-hidden="true"></div><div class="result-copy"><div class="result-title">프로젝트 브리프.pdf</div><div class="result-meta">PDF · 3일 전 수정</div></div><button class="result-more" type="button" aria-label="프로젝트 브리프 더보기">···</button></article><article class="result-card" data-type="document" data-od-id="search-result-hwp"><div class="thumb hwp" aria-hidden="true"></div><div class="result-copy"><div class="result-title">회의 기록_2026-08-11.hwp</div><div class="result-meta">HWP · 지난주 수정</div></div><button class="result-more" type="button" aria-label="회의 기록 더보기">···</button></article><article class="result-card" data-type="memo" data-od-id="search-result-memo"><div class="thumb memo" aria-hidden="true"></div><div class="result-copy"><div class="result-title">다음 주에 확인할 것</div><div class="result-meta">메모 · 2주 전 수정</div></div><button class="result-more" type="button" aria-label="다음 주에 확인할 것 더보기">···</button></article></div><div class="state" hidden data-od-id="search-empty"><strong>검색 결과가 없습니다</strong>다른 키워드로 다시 검색해 보세요.</div><div class="state" hidden data-od-id="search-loading"><strong>검색 중입니다</strong>잠시만 기다려 주세요.</div><div class="state" hidden data-od-id="search-error"><strong>검색 결과를 불러오지 못했습니다</strong>잠시 후 다시 시도해 주세요.</div></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="search-bottom-nav"><div class="nav-inner"><a class="nav-item" href="docnote-home-refined.html" data-od-id="nav-home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path><path d="M9 20v-6h6v6"></path></svg></span><span>홈</span></a><a class="nav-item" href="docnote-documents-refined.html" data-od-id="nav-documents"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"></path><path d="M14 3v4h4M9 12h6M9 16h6"></path></svg></span><span>문서</span></a><button class="nav-item create" type="button" data-od-id="nav-create"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span><span>새로 만들기</span></button><a class="nav-item active" href="docnote-search-refined.html" aria-current="page" data-od-id="nav-search"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.4 4.4"></path></svg></span><span>검색</span></a><a class="nav-item" href="docnote-settings-refined.html" data-od-id="nav-settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.2-1.7l1.3-1-1.5-2.6-1.6.7a7 7 0 0 0-1.5-.9L15.2 4h-3l-.3 2.5a7 7 0 0 0-1.5.9l-1.6-.7-1.5 2.6 1.3 1A7 7 0 0 0 8.5 12c0 .6.1 1.2.2 1.7l-1.3 1 1.5 2.6 1.6-.7a7 7 0 0 0 1.5.9l.3 2.5h3l.3-2.5a7 7 0 0 0 1.5-.9l1.6.7 1.5-2.6-1.3-1c.1-.5.2-1.1.2-1.7Z"></path></svg></span><span>설정</span></a></div></nav>
  <script>
    (function(){
      var input=document.getElementById('search-input');
      var clear=document.getElementById('clear-search');
      var cards=[].slice.call(document.querySelectorAll('.result-card'));
      var count=document.getElementById('result-count');
      var empty=document.querySelector('[data-od-id="search-empty"]');
      function update(){clear.hidden=!input.value.trim();}
      input.addEventListener('input',update); clear.addEventListener('click',function(){input.value='';update();input.focus();});
      document.querySelectorAll('.chip').forEach(function(chip){chip.addEventListener('click',function(){document.querySelectorAll('.chip').forEach(function(item){item.classList.remove('active')});chip.classList.add('active');var filter=chip.dataset.filter;var visible=0;cards.forEach(function(card){var show=filter==='all'||card.dataset.type===filter;card.hidden=!show;if(show)visible++;});count.textContent=visible+'개';empty.hidden=visible!==0;});});
      document.querySelector('[data-od-id="search-close"]').addEventListener('click',function(){location.href='docnote-home-refined.html';});
      document.querySelector('[data-od-id="nav-create"]').addEventListener('click',function(){input.blur();});
    }());
  </script>
