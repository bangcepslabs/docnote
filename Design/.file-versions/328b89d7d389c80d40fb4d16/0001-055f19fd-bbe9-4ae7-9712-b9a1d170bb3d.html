<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocNote · 검색</title>
  <style>
    :root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--radius-md:14px;--nav:76px}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:0 auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-family:var(--display);font-size:24px;line-height:1.35;font-weight:650;letter-spacing:-.01em}.close-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--muted);cursor:pointer}.close-btn:hover{background:var(--subtle);color:var(--fg)}.close-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}.search-field{height:48px;margin-top:8px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.search-field:focus-within{border-color:color-mix(in oklch,var(--accent) 46%,var(--border));box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 12%,transparent)}.search-field svg{width:19px;height:19px;flex:0 0 19px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.search-field input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:15px}.search-field input::placeholder{color:var(--muted)}.clear-btn{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--muted);opacity:.42;display:grid;place-items:center;cursor:pointer}.clear-btn:hover{background:var(--subtle);color:var(--fg);opacity:1}.clear-btn[hidden]{display:none}.clear-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}.filters{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}.chip:hover{border-color:color-mix(in oklch,var(--fg) 28%,var(--border));color:var(--fg)}.chip.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.result-head{margin-top:24px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.result-head h2{margin:0;font-family:var(--display);font-size:17px;line-height:1.45;font-weight:650}.result-head span{color:var(--muted);font-size:12px}.results{display:grid;gap:8px;margin-top:12px}.result-card{min-height:80px;display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid color-mix(in oklch,var(--border) 72%,transparent);border-radius:var(--radius-md);background:color-mix(in oklch,var(--surface) 84%,transparent)}.thumb{width:48px;height:58px;flex:0 0 48px;border-radius:7px;border:1px solid color-mix(in oklch,var(--fg) 9%,transparent);position:relative;overflow:hidden}.thumb.notebook{background:oklch(76% .08 205)}.thumb.notebook:after{content:"노트북";position:absolute;left:7px;bottom:8px;color:white;font-size:8px;font-weight:650}.thumb.pdf{background:oklch(96% .015 35)}.thumb.pdf:before{content:"PDF";position:absolute;left:7px;top:8px;padding:3px 4px;border-radius:4px;background:oklch(60% .12 35);color:white;font-size:7px;font-weight:700}.thumb.hwp{background:oklch(96% .015 145)}.thumb.hwp:before{content:"HWP";position:absolute;left:7px;top:8px;padding:3px 4px;border-radius:4px;background:oklch(54% .1 145);color:white;font-size:7px;font-weight:700}.thumb.memo{background:oklch(91% .05 85)}.thumb.memo:before{content:"메모";position:absolute;left:7px;top:8px;color:oklch(35% .05 80);font-size:8px;font-weight:650}.result-copy{min-width:0;flex:1}.result-title{font-size:14px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-meta{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}.result-more{width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:20px;cursor:pointer}.result-more:hover{background:var(--subtle);color:var(--fg)}.empty{margin-top:16px;padding:24px 16px;border:1px dashed var(--border);border-radius:var(--radius-md);text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid color-mix(in oklch,var(--border) 75%,transparent);backdrop-filter:blur(14px)}.nav-inner{width:min(100%,720px);height:60px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{min-height:48px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11px;line-height:1.2;cursor:pointer}.nav-item:hover{background:var(--subtle);color:var(--fg)}.nav-item.active{color:var(--fg);font-weight:600}.nav-icon{font-size:21px;line-height:1}.nav-item.create{color:var(--accent)}.nav-item.create .nav-icon{font-size:24px}@media(min-width:600px){.app{padding-left:24px;padding-right:24px;padding-bottom:36px}.header{height:72px}.header h1{font-size:26px}.bottom-nav{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
  <main class="app" data-od-id="search-screen">
    <header class="header" data-od-id="search-header"><h1 data-od-id="search-title">검색</h1><button class="close-btn" aria-label="검색 닫기" data-od-id="search-close"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg></button></header>
    <label class="search-field" data-od-id="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.4 4.4"></path></svg><input id="search-input" type="search" placeholder="노트북, 문서, 메모 검색" aria-label="검색어" /><button class="clear-btn" id="clear-search" type="button" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg></button></label>
    <div class="filters" role="group" aria-label="검색 결과 필터" data-od-id="search-filters"><button class="chip active">전체</button><button class="chip">노트북</button><button class="chip">문서</button><button class="chip">메모</button></div>
    <section data-od-id="search-results"><div class="result-head"><h2>최근 검색 결과</h2><span>4개</span></div><div class="results"><article class="result-card" data-od-id="search-result-notebook"><div class="thumb notebook" aria-hidden="true"></div><div class="result-copy"><div class="result-title">주간 회고 노트</div><div class="result-meta">노트북 · 어제 수정</div></div><button class="result-more" aria-label="주간 회고 노트 더보기">···</button></article><article class="result-card" data-od-id="search-result-pdf"><div class="thumb pdf" aria-hidden="true"></div><div class="result-copy"><div class="result-title">프로젝트 브리프.pdf</div><div class="result-meta">PDF · 3일 전 수정</div></div><button class="result-more" aria-label="프로젝트 브리프 더보기">···</button></article><article class="result-card" data-od-id="search-result-hwp"><div class="thumb hwp" aria-hidden="true"></div><div class="result-copy"><div class="result-title">회의 기록_2026-08-11.hwp</div><div class="result-meta">HWP · 지난주 수정</div></div><button class="result-more" aria-label="회의 기록 더보기">···</button></article><article class="result-card" data-od-id="search-result-memo"><div class="thumb memo" aria-hidden="true"></div><div class="result-copy"><div class="result-title">다음 주에 확인할 것</div><div class="result-meta">메모 · 2주 전 수정</div></div><button class="result-more" aria-label="다음 주에 확인할 것 더보기">···</button></article></div><div class="empty" hidden data-od-id="search-empty"><strong>검색 결과가 없습니다</strong>다른 키워드로 다시 검색해 보세요.</div></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="search-bottom-nav"><div class="nav-inner"><a class="nav-item" href="docnote-home-refined.html" data-od-id="nav-home"><span class="nav-icon">⌂</span><span>홈</span></a><a class="nav-item" href="docnote-documents-refined.html" data-od-id="nav-documents"><span class="nav-icon">▤</span><span>문서</span></a><button class="nav-item create" data-od-id="nav-create"><span class="nav-icon">＋</span><span>새로 만들기</span></button><a class="nav-item active" href="docnote-search-refined.html" aria-current="page" data-od-id="nav-search"><span class="nav-icon">⌕</span><span>검색</span></a><a class="nav-item" href="docnote-settings-design.html" data-od-id="nav-settings"><span class="nav-icon">⚙</span><span>설정</span></a></div></nav>
  <script>var input=document.getElementById('search-input'),clear=document.getElementById('clear-search');input.addEventListener('input',function(){clear.hidden=!input.value});clear.addEventListener('click',function(){input.value='';clear.hidden=true;input.focus()});document.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});b.classList.add('active')})});document.querySelector('[data-od-id="search-close"]').addEventListener('click',function(){history.back()});</script>
</body>
</html>
