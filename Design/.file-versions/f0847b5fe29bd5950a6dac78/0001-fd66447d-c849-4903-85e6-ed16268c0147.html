<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>DocNote · 홈</title>
<style>
:root{--bg:oklch(.977 .004 260);--surface:oklch(1 0 0);--subtle:oklch(.958 .007 255);--fg:oklch(.205 .027 250);--muted:oklch(.49 .025 250);--border:oklch(.90 .012 250);--accent:oklch(.52 .115 247);--accent-soft:oklch(.93 .032 247);--success:oklch(.52 .12 150);--display:"SUIT","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}button,input{font:inherit}button{border:0;background:transparent;cursor:pointer}a{color:inherit;text-decoration:none}.app{max-width:720px;margin:auto}.pad{padding-inline:16px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 22px/1.35 var(--display)}.icon{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;color:var(--fg)}.icon:hover{background:var(--subtle)}.icon:focus-visible,.primary:focus-visible,.secondary:focus-visible,.link:focus-visible,.nav:focus-visible,.template:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.hero{display:grid;gap:12px;margin-top:16px}.eyebrow{margin:0;color:var(--muted);font-size:12px;line-height:1.55;font-weight:650}.hero h1{max-width:20ch;margin:0;font:700 24px/1.4 var(--display)}.hero p{max-width:36ch;margin:0;color:var(--muted);font-size:13px;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.primary,.secondary{min-height:44px;border-radius:12px;padding-inline:16px;font-size:14px;font-weight:700}.primary{background:var(--accent);color:var(--surface)}.primary:hover{background:oklch(.44 .115 247)}.secondary{border:1px solid var(--border);background:var(--surface)}.secondary:hover{background:var(--subtle)}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section h2{margin:0;font:700 17px/1.45 var(--display)}.link{min-height:44px;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:650}.link:hover{color:var(--fg)}.notebook-row,.template-row{display:grid;grid-auto-flow:column;overflow-x:auto;scrollbar-width:none}.notebook-row::-webkit-scrollbar,.template-row::-webkit-scrollbar{display:none}.notebook-row{grid-auto-columns:minmax(140px,42%);gap:12px}.notebook{overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.cover{height:156px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px}.blue{background:oklch(.91 .035 247);color:oklch(.34 .08 247)}.green{background:oklch(.91 .045 130);color:oklch(.35 .07 130)}.rose{background:oklch(.93 .045 25);color:oklch(.39 .09 25)}.mark{font-size:11px;font-weight:700;letter-spacing:.08em}.cover-title{max-width:8ch;font:700 18px/1.4 var(--display)}.lines{position:absolute;top:50px;right:16px;width:48px;height:72px;opacity:.32;border-top:1px solid currentColor;background:repeating-linear-gradient(to bottom,transparent 0,transparent 14px,currentColor 15px,currentColor 16px)}.meta{padding:12px}.meta strong,.doc-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;line-height:1.5}.meta span,.doc-copy span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.55}.template-row{grid-auto-columns:124px;gap:8px}.template{height:136px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left}.template:hover{background:var(--subtle)}.paper{height:76px;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:8px;background:var(--subtle)}.paper:before{content:"";position:absolute;inset:12px 10px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 11px,oklch(.86 .018 250) 12px,oklch(.86 .018 250) 13px)}.cornell:after{content:"";position:absolute;top:12px;bottom:12px;left:36px;border-left:2px solid oklch(.73 .07 247)}.weekly:before{background:linear-gradient(to right,transparent 0 32%,oklch(.86 .018 250) 33% 34%,transparent 35% 65%,oklch(.86 .018 250) 66% 67%,transparent 68%),repeating-linear-gradient(to bottom,transparent 0,transparent 22px,oklch(.86 .018 250) 23px,oklch(.86 .018 250) 24px)}.meeting:after{content:"✓  ·  ○  ·  □";position:absolute;left:10px;bottom:10px;color:var(--muted);font-size:11px}.template strong{display:block;margin-top:8px;font-size:13px;line-height:1.5}.template span{display:block;margin-top:2px;color:var(--muted);font-size:11px}.docs{display:grid;gap:8px}.doc{min-height:80px;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid color-mix(in oklch,var(--border) 70%,transparent);border-radius:12px;background:var(--surface)}.doc:hover{border-color:var(--border)}.preview{width:48px;height:60px;flex:none;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:8px;background:var(--subtle)}.preview:before{content:"";position:absolute;inset:12px 8px;background:repeating-linear-gradient(to bottom,oklch(.77 .02 250) 0 2px,transparent 2px 9px)}.pdf{background:oklch(.95 .035 25)}.hwp{background:oklch(.94 .035 247)}.doc-copy{min-width:0;flex:1}.dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--success)}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;height:80px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:color-mix(in oklch,var(--surface) 94%,transparent);backdrop-filter:blur(16px)}.nav{min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:11px;font-weight:650}.nav.active{color:var(--accent);background:var(--accent-soft)}.create-mark{width:40px;height:40px;display:grid;place-items:center}.toast{position:fixed;z-index:20;left:16px;right:16px;bottom:92px;max-width:480px;margin:auto;padding:12px 16px;border-radius:12px;background:var(--fg);color:var(--surface);font-size:13px;text-align:center}@media(min-width:720px){.app{max-width:960px}.hero{grid-template-columns:1fr 260px;align-items:end;column-gap:32px}.hero>p{grid-column:2;grid-row:1;align-self:center}.actions{grid-column:1}.notebook-row{grid-auto-columns:minmax(180px,1fr);overflow:visible}.template-row{grid-auto-columns:minmax(140px,1fr);overflow:visible}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
 </style>
<style>
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .bottom{height:calc(76px + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom)}
  .toast{bottom:88px}
  .meeting:after{content:"✓ · ○ · □"}
  @media(min-width:720px){.bottom{padding-left:24px;padding-right:24px}}
</style></head>
<body>
  <main class="app" data-od-id="home-screen">
    <header class="header pad" data-od-id="app-header"><strong class="brand">DocNote</strong><a class="icon" href="docnote-search-refined.html" aria-label="검색" data-od-id="home-search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></a></header>
    <section class="pad hero" data-od-id="home-hero"><div><p class="eyebrow">오늘의 작업 공간</p><h1>최근 작업을 이어가세요</h1></div><p>노트북과 최근 문서를 빠르게 다시 엽니다.</p><div class="actions"><button class="primary" data-od-id="home-create-notebook">새 노트북 만들기</button><a class="secondary" href="docnote-documents-refined.html" data-od-id="home-open-documents">문서 둘러보기</a></div></section>
    <section class="pad section" data-od-id="notebook-library"><div class="section-head"><h2>내 노트북</h2><a class="link" href="docnote-documents-refined.html" data-od-id="notebook-view-all">모두 보기 ›</a></div><div class="notebook-row"><article class="notebook" data-od-id="notebook-study"><div class="cover blue"><span class="mark">DOCNOTE</span><span class="cover-title">공부 기록</span><span class="lines"></span></div><div class="meta"><strong>공부 기록</strong><span>Cornell · 12페이지</span></div></article><article class="notebook" data-od-id="notebook-project"><div class="cover green"><span class="mark">DOCNOTE</span><span class="cover-title">프로젝트 노트</span><span class="lines"></span></div><div class="meta"><strong>프로젝트 노트</strong><span>줄 노트 · 8페이지</span></div></article><article class="notebook" data-od-id="notebook-weekly"><div class="cover rose"><span class="mark">DOCNOTE</span><span class="cover-title">주간 플래너</span><span class="lines"></span></div><div class="meta"><strong>주간 플래너</strong><span>Weekly · 5페이지</span></div></article></div></section>
    <section class="pad section" data-od-id="template-library"><div class="section-head"><h2>템플릿으로 시작</h2><a class="link" href="#" data-od-id="template-view-all">모두 보기 ›</a></div><div class="template-row"><button class="template" data-od-id="template-cornell"><div class="paper cornell"></div><strong>공부</strong><span>Cornell</span></button><button class="template" data-od-id="template-weekly"><div class="paper weekly"></div><strong>플래너</strong><span>Weekly</span></button><button class="template" data-od-id="template-meeting"><div class="paper meeting"></div><strong>회의</strong><span>Meeting note</span></button></div></section>
    <section class="pad section" data-od-id="recent-documents"><div class="section-head"><h2>최근 문서</h2><a class="link" href="docnote-documents-refined.html" data-od-id="recent-documents-link">문서 보기 ›</a></div><div class="docs"><article class="doc" data-od-id="recent-pdf"><div class="preview pdf"></div><div class="doc-copy"><strong>2024_회의자료.pdf</strong><span>PDF · 어제 오후 4:12</span></div><span class="dot" title="저장됨"></span><button class="icon" aria-label="문서 메뉴" data-od-id="recent-pdf-menu">•••</button></article><article class="doc" data-od-id="recent-hwp"><div class="preview hwp"></div><div class="doc-copy"><strong>서비스 기획안.hwpx</strong><span>HWPX · 월요일 오전 9:40</span></div><span class="dot" title="저장됨"></span><button class="icon" aria-label="문서 메뉴" data-od-id="recent-hwp-menu">•••</button></article></div></section>
  </main>
  <nav class="bottom" aria-label="주요 메뉴" data-od-id="bottom-navigation"><a class="nav active" href="#" aria-current="page" data-od-id="nav-home"><span>⌂</span><span>홈</span></a><a class="nav" href="docnote-documents-refined.html" data-od-id="nav-documents"><span>▤</span><span>문서</span></a><button class="nav" data-od-id="nav-create"><span class="create-mark">＋</span><span>새로 만들기</span></button><a class="nav" href="docnote-search-refined.html" data-od-id="nav-search"><span>⌕</span><span>검색</span></a><a class="nav" href="docnote-settings-design.html" data-od-id="nav-settings"><span>⚙</span><span>설정</span></a></nav><div class="toast" data-od-id="home-toast" hidden role="status"></div>
  <script>const t=document.querySelector('.toast');document.querySelector('[data-od-id="nav-create"]').onclick=()=>{t.textContent='새 노트북 만들기 흐름을 엽니다.';t.hidden=false;setTimeout(()=>t.hidden=true,1800)};document.querySelector('[data-od-id="home-create-notebook"]').onclick=document.querySelector('[data-od-id="nav-create"]').onclick</script>
