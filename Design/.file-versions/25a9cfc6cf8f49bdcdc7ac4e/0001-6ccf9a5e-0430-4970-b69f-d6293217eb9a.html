<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocNote · 검색 디자인 시안</title>
  <style>
    :root{--bg:oklch(.977 .004 260);--surface:oklch(1 0 0);--subtle:oklch(.958 .007 255);--fg:oklch(.205 .027 250);--muted:oklch(.49 .025 250);--border:oklch(.90 .012 250);--accent:oklch(.52 .115 247);--accent-soft:oklch(.93 .032 247);--font-display:"SUIT","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:0 auto}.screen{padding-inline:16px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.title{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.35;font-weight:700}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--fg)}.icon-btn:hover{background:var(--subtle)}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}.icon-btn:focus-visible,.filter:focus-visible,.search-field:focus-within,.nav-item:focus-visible,.more:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.search-field{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--muted)}.search-field input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:14px/1.5 var(--font-body)}.search-field input::placeholder{color:var(--muted)}.clear{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}.clear:hover{background:var(--subtle);color:var(--fg)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.filter{min-height:36px;padding:0 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:650}.filter:hover{background:var(--subtle);color:var(--fg)}.filter.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.result-head{display:flex;align-items:center;justify-content:space-between;margin-top:32px;margin-bottom:12px}.result-head h2{margin:0;font-family:var(--font-display);font-size:17px;line-height:1.45}.result-head span{font-size:12px;color:var(--muted)}.results{display:grid;gap:8px}.result{display:flex;align-items:center;gap:12px;min-height:82px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px}.result:hover{border-color:oklch(.78 .04 250)}.thumb{width:48px;height:58px;flex:none;border-radius:8px;border:1px solid var(--border);background:var(--subtle);position:relative;overflow:hidden}.thumb.cover-blue{background:oklch(.91 .035 247)}.thumb.cover-green{background:oklch(.91 .045 130)}.thumb.pdf{background:oklch(.95 .035 25)}.thumb.memo{background:oklch(.94 .03 130)}.thumb:before{content:"";position:absolute;inset:12px 8px;background:repeating-linear-gradient(to bottom,oklch(.76 .025 250) 0 2px,transparent 2px 10px)}.thumb.cover-blue:before,.thumb.cover-green:before{inset:auto 8px 10px;width:28px;height:24px;background:repeating-linear-gradient(to bottom,currentColor 0 1px,transparent 1px 7px);color:oklch(.34 .08 247);opacity:.5}.thumb.cover-green:before{color:oklch(.35 .07 130)}.result-copy{min-width:0;flex:1}.result-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;line-height:1.5}.result-copy p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.more{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:var(--muted)}.more:hover{background:var(--subtle);color:var(--fg)}.no-result{margin-top:24px;padding:32px 24px;text-align:center;border:1px dashed var(--border);border-radius:16px;background:var(--surface)}.no-result h2{margin:12px 0 4px;font-family:var(--font-display);font-size:17px;line-height:1.45}.no-result p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:80px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid var(--border);backdrop-filter:blur(16px)}.nav-item{min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;background:none;color:var(--muted);font-size:11px;font-weight:650}.nav-item.active{color:var(--accent);background:var(--accent-soft)}.nav-create .create-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--fg)}
  </style>
</head>
<body>
  <main class="app" data-od-id="search-screen">
    <header class="header screen" data-od-id="search-header"><h1 class="title">검색</h1><button class="icon-btn" aria-label="검색 닫기" data-od-id="search-close">×</button></header>
    <section class="screen" data-od-id="search-controls"><label class="search-field" data-od-id="search-field"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input type="search" placeholder="노트북, 문서, 메모 검색" aria-label="문서 검색"/><button class="clear" aria-label="검색어 지우기">×</button></label><div class="filters" role="tablist" aria-label="검색 범위"><button class="filter active" role="tab" data-od-id="search-filter-all">전체</button><button class="filter" role="tab" data-od-id="search-filter-notebook">노트북</button><button class="filter" role="tab" data-od-id="search-filter-pdf">PDF</button><button class="filter" role="tab" data-od-id="search-filter-hwp">HWP</button><button class="filter" role="tab" data-od-id="search-filter-memo">메모</button></div></section>
    <section class="screen" data-od-id="search-results"><div class="result-head"><h2>최근 검색 결과</h2><span>4개</span></div><div class="results"><article class="result" data-od-id="search-result-notebook"><div class="thumb cover-blue" aria-label="노트북 표지 미리보기"></div><div class="result-copy"><strong>공부 기록</strong><p>노트북 · Cornell · 오늘 오전 10:24</p></div><button class="more" aria-label="공부 기록 메뉴"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article><article class="result" data-od-id="search-result-pdf"><div class="thumb pdf" aria-label="PDF 첫 페이지 미리보기"></div><div class="result-copy"><strong>2024_회의자료.pdf</strong><p>PDF · 18페이지 · 어제 오후 4:12</p></div><button class="more" aria-label="2024 회의자료 메뉴"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article><article class="result" data-od-id="search-result-hwp"><div class="thumb cover-green" aria-label="HWP 첫 페이지 미리보기"></div><div class="result-copy"><strong>서비스 기획안.hwpx</strong><p>HWPX · 7페이지 · 월요일 오전 9:40</p></div><button class="more" aria-label="서비스 기획안 메뉴"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article><article class="result" data-od-id="search-result-memo"><div class="thumb memo" aria-label="메모 미리보기"></div><div class="result-copy"><strong>다음 주 회의에서 확인할 것</strong><p>메모 · 메모장 · 지난 금요일</p></div><button class="more" aria-label="메모 메뉴"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article></div><div class="no-result" data-od-id="search-empty-state" hidden><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><h2>검색 결과가 없습니다</h2><p>다른 단어를 입력하거나 검색 범위를 바꿔 보세요.</p></div></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="bottom-navigation"><a class="nav-item" href="docnote-home-design.html" data-od-id="nav-home"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg><span>홈</span></a><a class="nav-item" href="docnote-documents-design.html" data-od-id="nav-documents"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span>문서</span></a><button class="nav-item nav-create" data-od-id="nav-create"><span class="create-icon">＋</span><span>새로 만들기</span></button><a class="nav-item active" href="#" data-od-id="nav-search"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>검색</span></a><a class="nav-item" href="#" data-od-id="nav-settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13 .1-1-.1-1 1.5-1.3-1.6-2.7-1.9.8a8 8 0 0 0-1.7-1L15 3.8h-3l-.3 2a8 8 0 0 0-1.7 1l-1.9-.8-1.6 2.7L8 10a8 8 0 0 0-.1 2L6.5 13l1.6 2.7 1.9-.8a8 8 0 0 0 1.7-1l.3 2h3l.3-2a8 8 0 0 0 1.7-1l1.9.8 1.6-.8 1.6 2.7Z"/></svg><span>설정</span></a></nav>
  <script>document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}));document.querySelector('[data-od-id="nav-create"]').addEventListener('click',()=>alert('새 노트북 만들기 흐름을 엽니다.'))</script>
</body>
</html>
