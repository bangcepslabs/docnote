<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DocNote · 표지 선택</title><style>
:root{--bg:oklch(97.5% .012 230);--surface:oklch(99% .006 230);--subtle:oklch(94.5% .018 230);--fg:oklch(25% .03 245);--muted:oklch(52% .03 245);--border:oklch(87% .025 230);--accent:oklch(42% .14 245);--accent-soft:oklch(91% .045 235);--body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--body)}body{padding-bottom:28px}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 58%,white);outline-offset:3px}.app{width:min(100%,720px);margin:auto;padding:0 16px 28px}.header{height:64px;display:flex;align-items:center;gap:12px}.back{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);font-size:22px}.header h1{margin:0;font-family:var(--display);font-size:24px;font-weight:650}.sub{margin:8px 0 0 56px;color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;overflow:auto;margin-top:24px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);font-size:13px}.chip.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.cover-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.cover-card{padding:8px;border:1px solid var(--border);border-radius:14px;background:var(--surface);text-align:left}.cover-card.active{border:2px solid var(--accent);padding:7px}.cover{height:152px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border-radius:9px;overflow:hidden}.cover:after{content:"";position:absolute;right:14px;top:48px;width:42px;height:64px;opacity:.32;border-top:1px solid currentColor;background:repeating-linear-gradient(to bottom,transparent 0 12px,currentColor 13px 14px)}.cover strong{font-size:10px;letter-spacing:.08em}.cover span{max-width:7ch;font-family:var(--display);font-size:17px;line-height:1.4;font-weight:650;z-index:1}.blue{background:oklch(86% .08 235);color:oklch(31% .09 245)}.sage{background:oklch(87% .065 135);color:oklch(32% .07 135)}.coral{background:oklch(88% .08 35);color:oklch(38% .1 35)}.lavender{background:oklch(89% .06 300);color:oklch(38% .08 300)}.ink{background:oklch(31% .035 245);color:oklch(96% .01 230)}.sand{background:oklch(90% .055 85);color:oklch(35% .06 80)}.cover-meta{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 2px}.cover-meta strong{font-size:13px}.cover-meta span{font-size:11px;color:var(--muted)}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.cover-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main class="app" data-od-id="cover-picker-screen"><header class="header"><a class="back" href="docnote-new-notebook-refined.html" aria-label="새 노트북으로 돌아가기" data-od-id="cover-picker-back">‹</a><h1 data-od-id="cover-picker-title">표지 선택</h1></header><p class="sub">노트북의 첫인상을 골라보세요.</p><div class="filters" role="group" aria-label="표지 카테고리" data-od-id="cover-filters"><button class="chip active">전체</button><button class="chip">미니멀</button><button class="chip">공부</button><button class="chip">업무</button><button class="chip">플래너</button><button class="chip">다크</button></div><section class="cover-grid" data-od-id="cover-grid"><button class="cover-card active" data-od-id="cover-blue"><div class="cover blue"><strong>DOCNOTE</strong><span>공부 기록</span></div><div class="cover-meta"><strong>차분한 블루</strong><span>선택됨</span></div></button><button class="cover-card" data-od-id="cover-sage"><div class="cover sage"><strong>DOCNOTE</strong><span>프로젝트</span></div><div class="cover-meta"><strong>소프트 세이지</strong><span>업무</span></div></button><button class="cover-card" data-od-id="cover-coral"><div class="cover coral"><strong>DOCNOTE</strong><span>주간 플래너</span></div><div class="cover-meta"><strong>코랄 플래너</strong><span>플래너</span></div></button><button class="cover-card" data-od-id="cover-lavender"><div class="cover lavender"><strong>DOCNOTE</strong><span>아이디어</span></div><div class="cover-meta"><strong>라벤더 메모</strong><span>미니멀</span></div></button><button class="cover-card" data-od-id="cover-ink"><div class="cover ink"><strong>DOCNOTE</strong><span>회의 기록</span></div><div class="cover-meta"><strong>잉크 다크</strong><span>업무</span></div></button><button class="cover-card" data-od-id="cover-sand"><div class="cover sand"><strong>DOCNOTE</strong><span>오늘의 할 일</span></div><div class="cover-meta"><strong>페이퍼 샌드</strong><span>플래너</span></div></button></section></main><script>document.querySelectorAll('.cover-card').forEach(function(card){card.addEventListener('click',function(){document.querySelectorAll('.cover-card').forEach(function(item){item.classList.remove('active');item.querySelector('.cover-meta span').textContent=item.querySelector('.cover-meta span').textContent==='선택됨'?'기본 선택':item.querySelector('.cover-meta span').textContent});card.classList.add('active');card.querySelector('.cover-meta span').textContent='선택됨'})});</script></body></html>
