<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocNote · 문서 디자인 시안</title>
  <style>
:root{--bg:oklch(.977 .004 260);--surface:oklch(1 0 0);--subtle:oklch(.958 .007 255);--fg:oklch(.205 .027 250);--muted:oklch(.49 .025 250);--border:oklch(.90 .012 250);--accent:oklch(.52 .115 247);--accent-soft:oklch(.93 .032 247);--font-display:"SUIT","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:0 auto}.screen{padding-inline:16px}.header{height:64px;display:flex;align-items:center;justify-content:space-between}.title{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.35;font-weight:700}.header-actions{display:flex;gap:4px}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--fg)}.icon-btn:hover{background:var(--subtle)}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}.icon-btn:focus-visible,.filter:focus-visible,.view-btn:focus-visible,.more:focus-visible,.nav-item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.intro{padding-top:12px}.intro p{margin:8px 0 0;max-width:40ch;color:var(--muted);font-size:14px;line-height:1.7}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.filter{min-height:36px;padding:0 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12px;font-weight:650;color:var(--muted)}.filter:hover{background:var(--subtle);color:var(--fg)}.filter.active{background:var(--fg);border-color:var(--fg);color:var(--surface)}.toolbar-right{display:flex;gap:4px}.view-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--muted)}.view-btn:hover{background:var(--subtle);color:var(--fg)}.list{display:grid;gap:12px;margin-top:16px}.doc-card{display:flex;align-items:center;gap:12px;min-height:96px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px}.doc-card:hover{border-color:oklch(.78 .04 250)}.preview{width:58px;height:72px;flex:none;padding:9px;background:var(--subtle);border:1px solid var(--border);border-radius:10px;position:relative;overflow:hidden}.preview:before{content:"";position:absolute;inset:14px 9px;background:repeating-linear-gradient(to bottom,oklch(.76 .025 250) 0 2px,transparent 2px 10px)}.preview:after{content:"";position:absolute;left:9px;right:9px;top:14px;height:6px;background:oklch(.64 .04 250);opacity:.55}.preview.pdf{background:oklch(.95 .035 25)}.preview.hwp{background:oklch(.94 .035 247)}.preview.memo{background:oklch(.94 .03 130)}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:14px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.copy small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.5}.more{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:50%}.more:hover{background:var(--subtle);color:var(--fg)}.empty{margin-top:24px;padding:32px 24px;text-align:center;border:1px dashed var(--border);border-radius:16px;background:var(--surface)}.empty svg{color:var(--muted)}.empty h2{margin:12px 0 4px;font-family:var(--font-display);font-size:17px;line-height:1.45}.empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:80px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in oklch,var(--surface) 94%,transparent);border-top:1px solid var(--border);backdrop-filter:blur(16px)}.nav-item{min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;background:none;color:var(--muted);font-size:11px;font-weight:650}.nav-item.active{color:var(--accent);background:var(--accent-soft)}.nav-create .create-icon{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--fg)}@media(max-width:360px){.doc-card{padding:10px;gap:10px}.copy strong{font-size:13px}}
    .nav-item{border:0;background:transparent}
  </style>
</head>
<body>
  <main class="app" data-od-id="documents-screen">
    <header class="header screen" data-od-id="documents-header"><h1 class="title">문서</h1><div class="header-actions"><button class="icon-btn" aria-label="문서 추가" data-od-id="documents-add"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="icon-btn" aria-label="문서 검색" data-od-id="documents-search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button></div></header>
    <section class="screen intro" data-od-id="documents-intro"><p>노트북과 가져온 문서를 한곳에서 관리합니다.</p></section>
    <section class="screen" data-od-id="documents-controls"><div class="toolbar"><strong style="font-size:14px;font-weight:650">전체 문서 <span style="color:var(--muted);font-weight:500">12</span></strong><div class="toolbar-right"><button class="view-btn" aria-label="목록 보기" data-od-id="documents-list-view"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button><button class="view-btn" aria-label="정렬 기준" data-od-id="documents-sort"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h8M8 18h4M4 6h.01M4 12h.01M4 18h.01"/></svg></button></div></div><div class="filters" role="tablist" aria-label="문서 유형 필터"><button class="filter active" role="tab" data-od-id="filter-all">전체</button><button class="filter" role="tab" data-od-id="filter-notebook">노트북</button><button class="filter" role="tab" data-od-id="filter-pdf">PDF</button><button class="filter" role="tab" data-od-id="filter-hwp">HWP</button><button class="filter" role="tab" data-od-id="filter-memo">메모</button></div></section>
    <section class="screen list" data-od-id="documents-list"><article class="doc-card" data-od-id="document-notebook"><div class="preview memo" aria-label="노트북 표지 미리보기"></div><div class="copy"><strong>공부 기록</strong><p>노트북 · Cornell · 12페이지</p><small>오늘 오전 10:24</small></div><button class="more" aria-label="공부 기록 메뉴" data-od-id="document-notebook-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article><article class="doc-card" data-od-id="document-pdf"><div class="preview pdf" aria-label="PDF 첫 페이지 미리보기"></div><div class="copy"><strong>2024_회의자료.pdf</strong><p>PDF · 18페이지</p><small>어제 오후 4:12</small></div><button class="more" aria-label="2024 회의자료 메뉴" data-od-id="document-pdf-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article><article class="doc-card" data-od-id="document-hwp"><div class="preview hwp" aria-label="HWP 첫 페이지 미리보기"></div><div class="copy"><strong>서비스 기획안.hwpx</strong><p>HWPX · 7페이지</p><small>월요일 오전 9:40</small></div><button class="more" aria-label="서비스 기획안 메뉴" data-od-id="document-hwp-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></article></section>
    <section class="screen empty" data-od-id="documents-empty-state" hidden><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12h6M9 16h4"/></svg><h2>아직 이 유형의 문서가 없습니다</h2><p>다른 필터를 선택하거나 새 문서를 추가해 보세요.</p></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴" data-od-id="bottom-navigation"><a class="nav-item" href="docnote-home-design.html" data-od-id="nav-home"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg><span>홈</span></a><a class="nav-item active" href="#" data-od-id="nav-documents"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span>문서</span></a><button class="nav-item nav-create" data-od-id="nav-create"><span class="create-icon">＋</span><span>새로 만들기</span></button><a class="nav-item" href="docnote-search-design.html" data-od-id="nav-search"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>검색</span></a><a class="nav-item" href="#" data-od-id="nav-settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13 .1-1-.1-1 1.5-1.3-1.6-2.7-1.9.8a8 8 0 0 0-1.7-1L15 3.8h-3l-.3 2a8 8 0 0 0-1.7 1l-1.9-.8-1.6 2.7L8 10a8 8 0 0 0-.1 2L6.5 13l1.6 2.7 1.9-.8a8 8 0 0 0 1.7-1l.3 2h3l.3-2a8 8 0 0 0 1.7-1l1.9.8 1.6.8 1.6-2.7Z"/></svg><span>설정</span></a></nav>
  <script>document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}));document.querySelector('[data-od-id="nav-create"]').addEventListener('click',()=>alert('새 노트북 만들기 흐름을 엽니다.'));document.querySelector('[data-od-id="nav-settings"]').href='docnote-settings-design.html'</script>
</body>
</html>
